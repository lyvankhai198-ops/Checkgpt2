name: Health Check VPS

on:
  schedule:
    - cron: '*/15 * * * *'   # Mỗi 15 phút
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check services on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "=== PM2 Status ==="
            pm2 status

            echo "=== API Server ==="
            if curl -sf http://localhost:3001/api/healthz > /dev/null; then
              echo "✅ API Server: OK"
            else
              echo "❌ API Server DOWN — restarting..."
              pm2 restart api-server
              sleep 5
              curl -sf http://localhost:3001/api/healthz > /dev/null && echo "✅ Restarted OK" || {
                echo "🚨 API Server vẫn lỗi!"
                pm2 logs api-server --lines 20 --nostream
              }
            fi

            echo "=== Telegram Bot ==="
            if pm2 show telegram-bot | grep -q "online"; then
              echo "✅ Telegram Bot: OK"
            else
              echo "❌ Bot DOWN — restarting..."
              pm2 restart telegram-bot
              sleep 3
              pm2 show telegram-bot | grep -E "status|restart"
            fi

            echo "=== Resources ==="
            free -m | grep Mem
            df -h / | tail -1

      - name: Alert on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            BOT_TOKEN=$(grep TELEGRAM_BOT_TOKEN /opt/checkgpt/.env | cut -d= -f2)
            CHAT_ID=$(grep ADMIN_CHAT_ID /opt/checkgpt/.env | cut -d= -f2)
            if [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -d chat_id="${CHAT_ID}" \
                -d text="🚨 VPS Health Check FAILED!%0A$(date '+%Y-%m-%d %H:%M')" > /dev/null
            fi
