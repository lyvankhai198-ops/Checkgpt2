openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ChatGPT Account Checker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: checker
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /check:
    post:
      operationId: checkAccounts
      tags: [checker]
      summary: Check accounts via SSE stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInput"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/CheckResult"

  /check-single:
    post:
      operationId: checkSingle
      tags: [checker]
      summary: Check a single account or token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInput"
      responses:
        "200":
          description: Single check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"

  # ── Admin auth ────────────────────────────────────────────────────────────────

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid credentials

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /admin/me:
    get:
      operationId: adminMe
      tags: [admin]
      summary: Get current admin info
      responses:
        "200":
          description: Current admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfile"
        "401":
          description: Not authenticated

  # ── Dashboard ─────────────────────────────────────────────────────────────────

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Dashboard statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ── Keys — export BEFORE /:id to avoid route shadowing ───────────────────────

  /admin/keys/export/csv:
    get:
      operationId: exportKeysCsv
      tags: [admin]
      summary: Export all keys as CSV
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /admin/keys:
    get:
      operationId: listKeys
      tags: [admin]
      summary: List license keys (paginated)
      parameters:
        - name: page
          in: query
          schema: { type: number }
        - name: limit
          in: query
          schema: { type: number }
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: plan
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Keys list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyPage"
    post:
      operationId: createKeys
      tags: [admin]
      summary: Create one or more license keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeysInput"
      responses:
        "201":
          description: Created keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchKeys"

  /admin/keys/{id}/detail:
    get:
      operationId: getKeyFullDetail
      tags: [admin]
      summary: Get full key detail — with activated user, activations, usage logs and stats
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Full key detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyFullDetailEnvelope"
        "404":
          description: Not found

  /admin/keys/{id}:
    get:
      operationId: getKey
      tags: [admin]
      summary: Get a single key
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyDetail"
        "404":
          description: Not found
    patch:
      operationId: updateKey
      tags: [admin]
      summary: Revoke / lock / unlock / extend a key
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyUpdateInput"
      responses:
        "200":
          description: Updated key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyDetail"
    delete:
      operationId: deleteKey
      tags: [admin]
      summary: Revoke a key
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  # ── Users ─────────────────────────────────────────────────────────────────────

  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List Telegram users (paginated)
      parameters:
        - name: page
          in: query
          schema: { type: number }
        - name: limit
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"

  /admin/inventory:
    get:
      operationId: getInventory
      tags: [admin]
      summary: Get key inventory counts grouped by plan
      responses:
        "200":
          description: Inventory counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryStats"

  /admin/users/{telegramId}/reset-trial:
    post:
      operationId: resetUserTrial
      tags: [admin]
      summary: Reset a user's free trial count to 0
      parameters:
        - name: telegramId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Trial reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  # ── Logs ──────────────────────────────────────────────────────────────────────

  /admin/logs/usage:
    get:
      operationId: listUsageLogs
      tags: [admin]
      summary: List usage logs (paginated)
      parameters:
        - name: page
          in: query
          schema: { type: number }
        - name: limit
          in: query
          schema: { type: number }
        - name: telegram_id
          in: query
          schema: { type: string }
        - name: since
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Usage logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageLogPage"

  /admin/logs/audit:
    get:
      operationId: listAuditLogs
      tags: [admin]
      summary: List audit logs (paginated)
      parameters:
        - name: page
          in: query
          schema: { type: number }
        - name: limit
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"

  /payment/orders:
    post:
      operationId: createOrder
      tags: [public]
      summary: Create a payment order (called by bot)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "200":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"

  /payment/webhook:
    post:
      operationId: sepayWebhook
      tags: [public]
      summary: SePay payment webhook
      responses:
        "200":
          description: Processed

  /admin/orders:
    get:
      operationId: listOrders
      tags: [admin]
      summary: List payment orders
      parameters:
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: limit
          schema: { type: number }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersEnvelope"

  /prices:
    get:
      operationId: getPrices
      tags: [public]
      summary: Get current plan prices (no auth required)
      responses:
        "200":
          description: Prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricesResponse"

  /admin/inventory/auto-stock:
    post:
      operationId: autoStock
      tags: [admin]
      summary: Auto-create keys to reach the stock target for a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoStockInput"
      responses:
        "200":
          description: Auto-stock result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoStockResult"

  # ── Settings ──────────────────────────────────────────────────────────────────

  /admin/settings:
    get:
      operationId: getSettings
      tags: [admin]
      summary: Get system settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsEnvelope"
    put:
      operationId: updateSettings
      tags: [admin]
      summary: Update system settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

components:
  schemas:
    # ── Shared ────────────────────────────────────────────────────────────────────

    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    OkResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    # ── Checker ───────────────────────────────────────────────────────────────────

    CheckInput:
      type: object
      required: [mode, rawText]
      properties:
        mode:
          type: string
          enum: [account, session]
        rawText: { type: string }
        concurrency: { type: number }
        proxies:
          type: array
          items: { type: string }

    CheckResult:
      type: object
      required: [status]
      properties:
        input: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        status:
          type: string
          enum: [live, die, deactivated, locked, error]
        user: { type: ["string", "null"] }
        plan: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        index: { type: ["number", "null"] }
        completed: { type: ["number", "null"] }

    # ── Admin auth ────────────────────────────────────────────────────────────────

    AdminLoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    AdminSession:
      type: object
      required: [ok, username]
      properties:
        ok: { type: boolean }
        username: { type: string }

    AdminProfile:
      type: object
      properties:
        admin:
          type: object
          properties:
            adminId: { type: number }
            username: { type: string }

    # ── Dashboard ─────────────────────────────────────────────────────────────────

    ChartPoint:
      type: object
      required: [date, uses]
      properties:
        date: { type: string }
        uses: { type: number }

    DashboardStats:
      type: object
      required: [totalKeys, activeKeys, inactiveKeys, expiringSoon, expiredKeys, totalUsers, todayUses, pendingOrders, deliveredOrders, totalRevenue, todayRevenue, usageChart]
      properties:
        totalKeys: { type: number }
        activeKeys: { type: number }
        inactiveKeys: { type: number }
        expiringSoon: { type: number }
        expiredKeys: { type: number }
        totalUsers: { type: number }
        todayUses: { type: number }
        pendingOrders: { type: number }
        deliveredOrders: { type: number }
        totalRevenue: { type: number }
        todayRevenue: { type: number }
        usageChart:
          type: array
          items:
            $ref: "#/components/schemas/ChartPoint"

    # ── License keys ──────────────────────────────────────────────────────────────

    ActivatedUserInfo:
      type: object
      properties:
        id: { type: number }
        telegramId: { type: string }
        username: { type: ["string", "null"] }
        firstName: { type: ["string", "null"] }
        trialCount: { type: number }
        currentKeyId: { type: ["number", "null"] }
        lastUsedAt: { type: ["string", "null"] }
        createdAt: { type: string }

    KeyActivationRecord:
      type: object
      properties:
        id: { type: number }
        keyId: { type: number }
        telegramId: { type: string }
        activatedAt: { type: string }
        deviceInfo: { type: ["string", "null"] }
        ipAddress: { type: ["string", "null"] }

    UsageActionStat:
      type: object
      required: [action, count]
      properties:
        action: { type: string }
        count: { type: number }

    LicenseKey:
      type: object
      required: [id, keyDisplay, status, totalUses, dailyUses, maxConcurrent, concurrentSlots, createdAt, updatedAt]
      properties:
        id: { type: number }
        keyDisplay: { type: string }
        status:
          type: string
          enum: [active, inactive, revoked, locked, expired]
        expiresAt: { type: ["string", "null"] }
        maxTotalUses: { type: ["number", "null"] }
        totalUses: { type: number }
        dailyLimit: { type: ["number", "null"] }
        dailyUses: { type: number }
        maxConcurrent: { type: number }
        concurrentSlots: { type: number }
        allowedTelegramId: { type: ["string", "null"] }
        activatedTelegramId: { type: ["string", "null"] }
        lockToTelegram: { type: boolean }
        note: { type: ["string", "null"] }
        plan:
          type: ["string", "null"]
          description: "Plan slug (any value)"
        createdAt: { type: string }
        updatedAt: { type: string }
        activatedUser:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActivatedUserInfo"

    KeyFullDetailEnvelope:
      type: object
      required: [key, activations, recentLogs, usageStats]
      properties:
        key:
          $ref: "#/components/schemas/LicenseKey"
        activatedUser:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActivatedUserInfo"
        activations:
          type: array
          items:
            $ref: "#/components/schemas/KeyActivationRecord"
        recentLogs:
          type: array
          items:
            $ref: "#/components/schemas/UsageLog"
        usageStats:
          type: array
          items:
            $ref: "#/components/schemas/UsageActionStat"

    KeyPage:
      type: object
      required: [keys, total, page, limit]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/LicenseKey"
        total: { type: number }
        page: { type: number }
        limit: { type: number }

    KeyDetail:
      type: object
      required: [key]
      properties:
        key:
          $ref: "#/components/schemas/LicenseKey"

    CreateKeysInput:
      type: object
      properties:
        count: { type: number }
        durationMinutes: { type: ["number", "null"] }
        neverExpires: { type: boolean }
        maxTotalUses: { type: ["number", "null"] }
        dailyLimit: { type: ["number", "null"] }
        maxConcurrent: { type: number }
        allowedTelegramId: { type: ["string", "null"] }
        lockToTelegram: { type: boolean }
        note: { type: ["string", "null"] }
        plan:
          type: ["string", "null"]
          description: "Plan slug (any value)"

    NewKeyRecord:
      type: object
      required: [rawKey, keyDisplay, id]
      properties:
        rawKey: { type: string }
        keyDisplay: { type: string }
        id: { type: number }

    BatchKeys:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/NewKeyRecord"

    KeyUpdateInput:
      type: object
      properties:
        action:
          type: string
          enum: [revoke, lock, unlock, extend, set_expiry]
        extraMinutes: { type: number }
        expiresAt: { type: string }
        note: { type: string }

    InventoryPlanStats:
      type: object
      required: [total, available, sold, revoked]
      properties:
        total: { type: number }
        available: { type: number }
        sold: { type: number }
        revoked: { type: number }

    InventoryStats:
      type: object
      description: "Keys are plan slugs (dynamic)"
      additionalProperties:
        $ref: "#/components/schemas/InventoryPlanStats"

    # ── Users ─────────────────────────────────────────────────────────────────────

    TelegramUser:
      type: object
      required: [id, telegramId, trialCount, createdAt]
      properties:
        id: { type: number }
        telegramId: { type: string }
        username: { type: ["string", "null"] }
        firstName: { type: ["string", "null"] }
        trialCount: { type: number }
        currentKeyId: { type: ["number", "null"] }
        currentKeyDisplay: { type: ["string", "null"] }
        lastUsedAt: { type: ["string", "null"] }
        createdAt: { type: string }

    UserPage:
      type: object
      required: [users, total, page, limit]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/TelegramUser"
        total: { type: number }
        page: { type: number }
        limit: { type: number }

    # ── Logs ──────────────────────────────────────────────────────────────────────

    UsageLog:
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: number }
        keyId: { type: ["number", "null"] }
        telegramId: { type: ["string", "null"] }
        action: { type: string }
        ipAddress: { type: ["string", "null"] }
        errorMessage: { type: ["string", "null"] }
        createdAt: { type: string }

    UsageLogPage:
      type: object
      required: [logs, total, page, limit]
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/UsageLog"
        total: { type: number }
        page: { type: number }
        limit: { type: number }

    AuditLog:
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: number }
        adminId: { type: ["number", "null"] }
        action: { type: string }
        targetType: { type: ["string", "null"] }
        targetId: { type: ["string", "null"] }
        ipAddress: { type: ["string", "null"] }
        createdAt: { type: string }

    AuditLogPage:
      type: object
      required: [logs, total, page, limit]
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total: { type: number }
        page: { type: number }
        limit: { type: number }

    # ── Settings ──────────────────────────────────────────────────────────────────

    SystemSettings:
      type: object
      properties:
        id: { type: number }
        telegramBotToken: { type: ["string", "null"] }
        timezone: { type: ["string", "null"] }
        defaultDurationMinutes: { type: ["number", "null"] }
        defaultMaxUses: { type: ["number", "null"] }
        defaultDailyLimit: { type: ["number", "null"] }
        defaultMaxConcurrent: { type: ["number", "null"] }
        notifyExpiryDays: { type: ["number", "null"] }
        welcomeMessage: { type: ["string", "null"] }
        basicPrice: { type: ["number", "null"] }
        proPrice: { type: ["number", "null"] }
        basicStockTarget: { type: ["number", "null"] }
        proStockTarget: { type: ["number", "null"] }
        bankName: { type: ["string", "null"] }
        bankBin: { type: ["string", "null"] }
        bankAccount: { type: ["string", "null"] }
        bankHolder: { type: ["string", "null"] }
        paymentEnabled: { type: ["number", "null"] }
        sepayApiKey: { type: ["string", "null"] }
        usdtWallet: { type: ["string", "null"] }
        usdtRateVnd: { type: ["number", "null"] }
        adminContact: { type: ["string", "null"] }
        proxyList: { type: ["string", "null"] }
        updatedAt: { type: ["string", "null"] }

    SettingsEnvelope:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/SystemSettings"

    SettingsInput:
      type: object
      properties:
        telegramBotToken: { type: string }
        timezone: { type: string }
        defaultDurationMinutes: { type: number }
        defaultMaxUses: { type: ["number", "null"] }
        defaultDailyLimit: { type: ["number", "null"] }
        defaultMaxConcurrent: { type: number }
        notifyExpiryDays: { type: number }
        welcomeMessage: { type: string }
        basicPrice: { type: number }
        proPrice: { type: number }
        basicStockTarget: { type: number }
        proStockTarget: { type: number }
        bankName: { type: string }
        bankBin: { type: string }
        bankAccount: { type: string }
        bankHolder: { type: string }
        paymentEnabled: { type: boolean }
        sepayApiKey: { type: string }
        usdtWallet: { type: string }
        usdtRateVnd: { type: number }
        adminContact: { type: string }
        proxyList: { type: string }

    CreateOrderInput:
      type: object
      required: [telegramId, plan]
      properties:
        telegramId: { type: string }
        username: { type: string }
        plan:
          type: string
          enum: [basic, pro]

    OrderResponse:
      type: object
      properties:
        orderId: { type: number }
        orderCode: { type: string }
        amount: { type: number }
        amountFormatted: { type: string }
        expiresAt: { type: string }
        qrUrl: { type: string }
        bank:
          type: object
          properties:
            name: { type: string }
            account: { type: string }
            holder: { type: string }

    Order:
      type: object
      properties:
        id: { type: number }
        telegramId: { type: string }
        username: { type: ["string", "null"] }
        plan: { type: string }
        amount: { type: number }
        orderCode: { type: string }
        status: { type: string }
        keyId: { type: ["number", "null"] }
        createdAt: { type: string }
        paidAt: { type: ["string", "null"] }
        deliveredAt: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"] }

    OrdersEnvelope:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total: { type: number }
        page: { type: number }
        limit: { type: number }

    PricesResponse:
      type: object
      required: [basicPrice, proPrice, basicPriceFormatted, proPriceFormatted]
      properties:
        basicPrice: { type: number }
        proPrice: { type: number }
        basicPriceFormatted: { type: string }
        proPriceFormatted: { type: string }
        basicStockTarget: { type: number }
        proStockTarget: { type: number }

    AutoStockInput:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          description: "Plan slug (any value)"

    AutoStockResult:
      type: object
      required: [created, available, target]
      properties:
        created: { type: number }
        available: { type: number }
        target: { type: number }
        newAvailable: { type: number }
        message: { type: string }
        keys:
          type: array
          items:
            type: object
            properties:
              id: { type: number }
              key: { type: string }
              display: { type: string }

    AdminPlansResponse:
      type: array
      items:
        type: object
        required: [slug, name]
